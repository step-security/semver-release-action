name: 'Semver Release'
description: 'Automatically create Semver compliant tags or releases based on PR labels'
author: 'step-security'

branding:
  icon: 'tag'
  color: 'green'

inputs:
  release_branch:
    description: 'Branch to tag'
    required: true
    default: master

  release_strategy:
    description: 'Release strategy'
    required: true
    default: release

  tag_format:
    description: 'Format used to create tags'
    required: true
    default: 'v%major%.%minor%.%patch%'

  tag:
    description: 'Tag to use'
    required: false

outputs:
  tag:
    description: 'The newly created tag'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/step-security/semver-release-action:v1.3.2@sha256:3237b54d56bf81a59180fbb2a699055d5b43262305b9edaea79f2960e4154698' # v1.3.2
  args:
    - ${{ inputs.release_branch }}
    - ${{ inputs.release_strategy }}
    - ${{ inputs.tag }}
    - ${{ inputs.tag_format }}
